<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logged out — Pi - π Academy</title>
<style>
  :root {
    --bg: #FBFBF7;
    --surface: #FFFFFF;
    --border: #E4E8E0;
    --text: #202A20;
    --muted: #6B756A;
    --accent: #3F7A3D;
    --accent-hover: #346833;
    --accent-soft: #E9F3E6;
    --accent-soft-border: #CFE4CA;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(32,42,32,0.05), 0 2px 8px rgba(32,42,32,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    font-size: 15.5px;
    line-height: 1.55;
  }
  a { color: inherit; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 40px 38px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .brand-badge {
    width: 48px; height: 48px;
    margin: 0 auto 18px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.4rem;
  }
  .title { font-size: 1.3rem; font-weight: 700; margin: 0 0 8px; }
  .sub { font-size: 0.92rem; color: var(--muted); margin: 0 0 28px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    font-size: 0.94rem;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none !important;
  }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-hover); }

  .secondary-link {
    display: inline-block;
    margin-top: 16px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--muted);
    text-decoration: none !important;
  }
  .secondary-link:hover { color: var(--accent-hover); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-badge">&pi;</div>
    <p class="title">You've been logged out</p>
    <p class="sub">Thanks for using the Pi Academy dashboard today.</p>
    <a href="{% url 'admin:login' %}" class="btn btn-accent">Log in again</a>
    <br>
    <a href="/" class="secondary-link">View site</a>
  </div>
</body>
</html>
